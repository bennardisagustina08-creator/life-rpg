<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#0b1020">

    <title>Life RPG</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="game">

        <!-- HEADER -->

        <header class="top-bar">

            <div>

                <p class="small-title">TU VIDA • TU RPG</p>

                <h1>🎮 LIFE RPG</h1>

            </div>

            <div class="coins">

                🪙 <span id="coins">0</span>

            </div>

        </header>

    <section id="homePage"></section>

        <!-- PERSONAJE -->

        <section class="character">

            <div class="avatar">
                👤
            </div>

            <div class="character-info">

                <div class="level-row">

                    <h2>AGUSTINA</h2>

                    <span>
                        LVL <strong id="level">1</strong>
                    </span>

                </div>


                <div class="xp-container">

                    <div
                        class="xp-bar"
                        id="xpBar">
                    </div>

                </div>


                <p id="xpText">
                    0 / 100 XP
                </p>

            </div>

        </section>


        <!-- STATS -->

        <section class="stats">

            <div class="stat">

                <span>❤️</span>

                <p>HP</p>

                <strong id="hp">
                    100
                </strong>

            </div>


            <div class="stat">

                <span>🔋</span>

                <p>Energía</p>

                <strong id="energy">
                    100
                </strong>

            </div>


            <div class="stat">

                <span>🔥</span>

                <p>Racha</p>

                <strong id="streak">
                    0
                </strong>

            </div>

        </section>


        <!-- MISIONES -->

        <section class="quests">

            <div class="section-title">

                <div>

                    <p class="small-title">
                        HOY
                    </p>

                    <h2>
                        📜 Misiones
                    </h2>

                </div>


                <button
                    class="add-button"
                    onclick="addQuest()"
                >
                    ＋
                </button>

            </div>


            <div id="questList"></div>

        </section>

        </section>
<!-- =========================
     MAPA
========================= -->

<section
    id="mapPage"
    class="page hidden"
>

    <div class="page-header">

        <p class="small-title">
            WORLD MAP
        </p>

        <h2>🗺️ Tu mundo</h2>

        <p>
            Explorá las distintas áreas de tu vida.
        </p>

    </div>


    <div class="map-grid">


        <button
            class="zone"
            onclick="selectZone('academy')"
        >

            <span class="zone-icon">
                📚
            </span>

            <strong>
                Academy
            </strong>

            <small>
                Estudio
            </small>

        </button>


        <button
            class="zone"
            onclick="selectZone('futsal')"
        >

            <span class="zone-icon">
                ⚽
            </span>

            <strong>
                Futsal Arena
            </strong>

            <small>
                Deporte
            </small>

        </button>


        <button
            class="zone"
            onclick="selectZone('home')"
        >

            <span class="zone-icon">
                🏠
            </span>

            <strong>
                Home
            </strong>

            <small>
                Orden
            </small>

        </button>


        <button
            class="zone"
            onclick="selectZone('creative')"
        >

            <span class="zone-icon">
                🎨
            </span>

            <strong>
                Creative Zone
            </strong>

            <small>
                Creatividad
            </small>

        </button>


        <button
            class="zone"
            onclick="selectZone('mind')"
        >

            <span class="zone-icon">
                🧠
            </span>

            <strong>
                Mind Zone
            </strong>

            <small>
                Aprendizaje
            </small>

        </button>


        <button
            class="zone"
            onclick="selectZone('pet')"
        >

            <span class="zone-icon">
                🐶
            </span>

            <strong>
                Pet Park
            </strong>

            <small>
                Mascota
            </small>

        </button>


    </div>

</section>


<!-- =========================
     LOGROS
========================= -->

<section
    id="achievementsPage"
    class="page hidden"
>

    <div class="page-header">

        <p class="small-title">
            ACHIEVEMENTS
        </p>

        <h2>🏆 Logros</h2>

        <p>
            Tus futuros logros aparecerán acá.
        </p>

    </div>

</section>


<!-- =========================
     TIENDA
========================= -->

<section
    <section id="shopPage" class="extra-page hidden">

    <h2>🛒 Tienda</h2>

    <p class="shop-coins">
        🪙 Tenés <span id="shopCoins">0</span> monedas
    </p>

    <div id="shopItems" class="shop-grid"></div>

</section>
</section>

        <!-- NAVEGACIÓN -->

        <nav <nav class="navigation">

    <button
        class="active"
        onclick="showPage('home', this)"
    >

        <span class="nav-icon">🏠</span>

        <span>Inicio</span>

    </button>


    <button
        onclick="showPage('map', this)"
    >

        <span class="nav-icon">🗺️</span>

        <span>Mapa</span>

    </button>


    <button
        onclick="showPage('achievements', this)"
    >

        <span class="nav-icon">🏆</span>

        <span>Logros</span>

    </button>


    <button
        onclick="showPage('shop', this)"
    >

        <span class="nav-icon">🛒</span>

        <span>Tienda</span>

    </button>

</nav>>

                <span class="nav-icon">

                <span>

            </button>


            <button>

            </button>

            </button>


            <button>

                <span class="nav-icon">
                    🛒

                <span>
                    Tienda
                </span>

            </button>

        </nav>

    </div>


    <script src="app.js"></script>

</body>

</html>
