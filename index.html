<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#0b1020">

    <title>Life RPG</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="game">

        <!-- HEADER -->

        <header class="top-bar">

            <div>

                <p class="small-title">TU VIDA • TU RPG</p>

                <h1>🎮 LIFE RPG</h1>

            </div>

            <div class="coins">

                🪙 <span id="coins">0</span>

            </div>

        </header>


        <!-- PERSONAJE -->

        <section class="character">

            <div class="avatar">
                👤
            </div>

            <div class="character-info">

                <div class="level-row">

                    <h2>AGUSTINA</h2>

                    <span>
                        LVL <strong id="level">1</strong>
                    </span>

                </div>


                <div class="xp-container">

                    <div
                        class="xp-bar"
                        id="xpBar">
                    </div>

                </div>


                <p id="xpText">
                    0 / 100 XP
                </p>

            </div>

        </section>


        <!-- STATS -->

        <section class="stats">

            <div class="stat">

                <span>❤️</span>

                <p>HP</p>

                <strong id="hp">
                    100
                </strong>

            </div>


            <div class="stat">

                <span>🔋</span>

                <p>Energía</p>

                <strong id="energy">
                    100
                </strong>

            </div>


            <div class="stat">

                <span>🔥</span>

                <p>Racha</p>

                <strong id="streak">
                    0
                </strong>

            </div>

        </section>


        <!-- MISIONES -->

        <section class="quests">

            <div class="section-title">

                <div>

                    <p class="small-title">
                        HOY
                    </p>

                    <h2>
                        📜 Misiones
                    </h2>

                </div>


                <button
                    class="add-button"
                    onclick="addQuest()"
                >
                    ＋
                </button>

            </div>


            <div id="questList"></div>

        </section>


        <!-- NAVEGACIÓN -->

        <nav class="navigation">

            <button class="active">

                <span class="nav-icon">
                    🏠
                </span>

                <span>
                    Inicio
                </span>

            </button>


            <button>

                <span class="nav-icon">
                    🗺️
                </span>

                <span>
                    Mapa
                </span>

            </button>


            <button>

                <span class="nav-icon">
                    🏆
                </span>

                <span>
                    Logros
                </span>

            </button>


            <button>

                <span class="nav-icon">
                    🛒
                </span>

                <span>
                    Tienda
                </span>

            </button>

        </nav>

    </div>


    <script src="app.js"></script>

</body>

</html>
